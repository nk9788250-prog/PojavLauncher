name: Build Quartrs Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "v3_openjdk" ]

jobs:
  build-quartrs-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Full PojavLauncher Open-Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rebrand App Name to Quartrs Launcher
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Quartrs Launcher<\/string>/g' app_pojavlauncher/src/main/res/values/strings.xml

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Compile Quartrs Launcher APK
        run: ./gradlew assembleDebug

      - name: Upload Ready Quartrs Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Quartrs-Launcher-Optimized-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
